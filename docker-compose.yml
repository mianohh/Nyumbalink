# Local development stack — Laravel Sail style.
# Docs: https://laravel.com/docs/sail
# Run everything through ./vendor/bin/sail (not plain "docker compose"),
# so WWWUSER/WWWGROUP are auto-detected.

x-laravel-app: &laravel-app
    build:
        context: ./vendor/laravel/sail/runtimes/8.4
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP}'
    image: sail-8.4/app
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER}'
        LARAVEL_SAIL: '1'
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
        - '.:/var/www/html'
    networks:
        - sail

services:
    laravel.test:
        <<: *laravel-app
        ports:
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        depends_on:
            mysql:
                condition: service_healthy
            mailpit:
                condition: service_started

    queue-worker:
        <<: *laravel-app
        # Wait for migrations before starting: on a fresh database the worker
        # would otherwise crash-loop on the missing cache/jobs tables.
        command: >
            sh -c 'until php artisan migrate:status >/dev/null 2>&1; do
                echo "queue-worker: waiting for migrations..."; sleep 3;
            done;
            exec php artisan queue:work --tries=3 --timeout=90 --sleep=1'
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
            mailpit:
                condition: service_started

    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 8

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local